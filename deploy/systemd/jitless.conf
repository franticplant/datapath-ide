# Optional stricter profile: /etc/systemd/system/datapath-bridge.service.d/jitless.conf
# V8 runs without a JIT (--jitless), so no page is ever writable and executable and
# MemoryDenyWriteExecute can be enforced. Trade-off: WebAssembly does not exist in --jitless mode,
# so the bridge drops the MCP tools verilog_elaborate and verilog_simulate and verilog_lint skips its
# Icarus compile step. Sync, the IDE, the workspace tools and the live browser tools are unaffected
# (simulation still runs in each browser tab). JavaScript runs interpreted (slower, still fine here).
[Service]
ExecStart=
ExecStart=/usr/bin/node --jitless --disallow-code-generation-from-strings --max-old-space-size=384 \
  /opt/datapath-studio/current/server/bridge.mjs \
  --dir /var/lib/datapath-bridge/workspace \
  --web /opt/datapath-studio/current/web \
  --poll-ms 1000
MemoryDenyWriteExecute=yes
