version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ".github:"
    groups:
      github-actions:
        patterns: ["*"]

  # Bundled into web/vendor: CI's "Vendored bundles are reproducible" check fails until the PR
  # also carries a rebundle (make bundle), so dependency bumps never ship stale vendor files.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps:"
    groups:
      npm:
        patterns: ["*"]
